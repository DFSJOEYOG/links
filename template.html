<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Joey Laskero · All my links</title>
<meta name="description" content="Joey Laskero (@DFSJOEYOG): every app link and code in one place. Polymarket, Kalshi, ReBet, Dabble, DraftKings IL, ero and more.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Joey Laskero · All my links">
<meta property="og:description" content="Every app link and code in one place.">
<style>
:root{--bg:#000000;--p:#7B2FF7;--r:#E6281E;--card:#0d0b12;--line:#26202f;--t:#fff;--m:#a9a3b5}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px 56px}
header{text-align:center;margin-bottom:22px}
h1{font-size:2rem;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
h1 span{color:var(--r)}
.handle{display:inline-block;margin-top:8px;color:var(--p);font-weight:800;text-decoration:none;font-size:1.05rem}
.sub{color:var(--m);margin-top:6px;font-size:.95rem}
.bar{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--p),var(--r));margin:18px 0 22px}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.hot{border-color:var(--p);box-shadow:0 0 0 1px rgba(123,47,247,.25),0 8px 28px rgba(123,47,247,.18)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
h3{font-size:1.3rem;font-weight:800}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--p);border:1px solid var(--p);border-radius:999px;padding:4px 9px;white-space:nowrap}
.blurb{color:var(--t);opacity:.9;margin-top:6px;font-size:.95rem}
.go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;margin-top:12px;border-radius:14px;background:var(--r);color:#fff;font-weight:900;font-size:1.15rem;text-decoration:none;letter-spacing:.01em;-webkit-tap-highlight-color:transparent}
.go:active{transform:scale(.98)}
.hot .go{background:linear-gradient(90deg,var(--r),#b51d15)}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;border:1px dashed var(--p);border-radius:12px;padding:8px 8px 8px 12px}
.code span{color:var(--m);font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.code b{color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;letter-spacing:.04em}
.code button{flex-shrink:0;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--p);color:#fff;font-weight:800;font-size:.95rem;cursor:pointer}
.code button.ok{background:#fff;color:#000}
h2.lane{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--r);margin:22px 0 2px}
h2.sec{font-size:1.4rem;font-weight:900;text-transform:uppercase;margin:34px 0 12px}
h2.sec span{color:var(--p)}
.socs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soc{display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:10px 14px;border-radius:14px;border:1px solid var(--p);text-decoration:none;color:#fff}
.soc:first-child{grid-column:1/-1;background:var(--p);border-color:var(--p)}
.soc b{font-size:1rem}.soc span{color:#e5dcff;font-size:.9rem}
footer{text-align:center;color:var(--m);font-size:.8rem;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Joey <span>Laskero</span></h1>
  <a class="handle" href="https://x.com/DFSJOEYOG" target="_blank" rel="noopener">@DFSJOEYOG</a>
  <p class="sub">Every app I use. Tap to join, copy the code.</p>
</header>
<div class="bar"></div>
<section class="list" aria-label="Top apps">
{{FEATURED}}
</section>
<h2 class="sec">More <span>apps</span></h2>
<section class="list" aria-label="More apps">
{{MORE}}
</section>
<h2 class="sec">Follow <span>me</span></h2>
<nav class="socs" aria-label="Socials">
{{SOCIALS}}
</nav>
<footer>@DFSJOEYOG</footer>
</div>
<script>
document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){var c=b.getAttribute('data-copy');function done(){var t=b.textContent;b.textContent='Copied!';b.classList.add('ok');setTimeout(function(){b.textContent=t;b.classList.remove('ok')},1500)}
if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(c).then(done,fb)}else{fb()}
function fb(){var a=document.createElement('textarea');a.value=c;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(a);done()}})});
</script>
</body>
</html>
